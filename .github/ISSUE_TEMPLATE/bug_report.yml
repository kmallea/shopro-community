name: Bug report
description: Report reproducible ShoPro behavior that appears broken
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ShoPro. Remove credentials, role links, browser-source URLs, private notes, and personal information before submitting.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed private links, credentials, and production information.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard or show creation
        - Edit Mode
        - Test Mode
        - Run Mode
        - Shared role view
        - OBS or browser source
        - Studio, camera, or chat
        - Theme Builder
        - Post Show or highlights
        - Account or authentication
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 128, Firefox 130, OBS 31 browser source
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots, recordings, or relevant details.

